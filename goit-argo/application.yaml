apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-apps
  namespace: infra-tools   # було argocd → тепер infra-tools
spec:
  project: default
  source:
    repoURL: <YOUR_REPO_URL>   # TODO: заміни на URL твого репозиторію
    targetRevision: HEAD
    path: goit-argo/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: infra-tools   # було argocd → тепер infra-tools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
